# Supervisord programs for the single-container Archive Relay collector.
# Lower priority values start first and stop last.
#
# The container runs: MariaDB (in-image), a one-shot DB/user initializer,
# the Fastify API (UI + /api + /healthz on one port), and the three workers.
# All program logs go to the container's stdout/stderr so `docker logs` works.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:mariadb]
command=/usr/local/bin/start-mariadb.sh
priority=10
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:db-init]
command=/usr/local/bin/init-mariadb.sh
priority=20
autorestart=false
startsecs=0
startretries=3
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/bin/sh -c "/usr/local/bin/wait-for-mariadb.sh && node packages/database/dist/migrate.js && exec node apps/api/dist/index.js"
user=node
priority=30
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:collector-worker]
command=/bin/sh -c "/usr/local/bin/wait-for-mariadb.sh && exec node apps/worker/dist/index.js"
user=node
priority=40
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

# Planning never contacts AO3 (it only generates IDs and inserts tasks). A
# single planner is enough: planning respects the source pause switch, and a
# second planner would only add DB lock contention (the collector is the real
# throughput ceiling anyway).
[program:planner-worker]
command=/bin/sh -c "/usr/local/bin/wait-for-mariadb.sh && exec node apps/planner-worker/dist/index.js"
user=node
priority=40
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:export-worker]
command=/bin/sh -c "/usr/local/bin/wait-for-mariadb.sh && exec node apps/export-worker/dist/index.js"
user=node
priority=40
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
