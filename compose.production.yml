name: archive-relay

# Single-container collector. Everything runs in one process tree under
# supervisord: MariaDB (in-image), the Fastify API (React UI + /api + /healthz
# on one port), and the collector/planner/export workers. MariaDB listens on
# 127.0.0.1 inside the container and is not exposed to the host.
services:
  collector:
    image: archive-relay:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_COMMIT: ${APP_VERSION:-development}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      APP_COMMIT: ${APP_VERSION:-development}
      COLLECTOR_DATABASE_URL: ${COLLECTOR_DATABASE_URL:?Set COLLECTOR_DATABASE_URL}
      COLLECTOR_DATABASE_NAME: ${COLLECTOR_DATABASE_NAME:-ao3_collector}
      COLLECTOR_DATABASE_USER: ${COLLECTOR_DATABASE_USER:-collector}
      COLLECTOR_DATABASE_PASSWORD: ${COLLECTOR_DATABASE_PASSWORD:?Set COLLECTOR_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_TOKEN: ${API_TOKEN:-}
      EXPORT_DIRECTORY: /data/exports
      COLLECTOR_BLOB_DIRECTORY: /data/blobs
      WORKER_ID: collector-worker-1
      PLANNER_WORKER_ID: planner-worker-1
      EXPORT_WORKER_ID: export-worker-1
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - collector-mariadb:/var/lib/mysql
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  collector-mariadb:
